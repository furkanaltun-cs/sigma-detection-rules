title: Password Reset Performed By Unexpected Account
id: 2a823939-ba6f-403f-ab55-38147d867212
status: experimental
description: |
    Detects an account password reset (Event ID 4724) performed by an interactive account
    that is not one of the approved identity-management service accounts.
    Machine accounts on either side are ignored.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724
author: Furkan Altun
date: 2026-11-23
tags:
    - attack.persistence
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4724
    filter_main_machine_actor:
        SubjectUserName|endswith: '$'
    filter_main_machine_target:
        TargetUserName|endswith: '$'
    filter_optional_approved_tools:
        # Replace with your password-management / IAM service accounts
        SubjectUserName:
            - 'svc_pam'
            - 'svc_iam'
            - 'svc_helpdesk'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - Help desk staff resetting passwords with personal admin accounts
    - Identity-management tools not yet added to the approved list
level: medium
