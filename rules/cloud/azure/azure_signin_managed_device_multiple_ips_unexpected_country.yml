title: Successful Sign-In From Unexpected Country On Managed Device
id: fb78be9c-0b3d-4bd8-a271-cfdf1aa46b08
name: azure_signin_success_unexpected_country
status: experimental
description: |
    Base rule. Successful Entra ID sign-in from a managed (corporate-named) device whose
    location is outside the list of countries where the organisation operates.
    Used by the correlation rule in this file; noisy on its own.
author: Furkan Altun
date: 2026-11-23
tags:
    - attack.initial-access
    - attack.t1078.004
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType: 0
        # Replace with your device naming prefixes
        DeviceDetail.displayName|startswith:
            - 'CORP-'
            - 'LT-'
    filter_main_expected_countries:
        # Replace with the country codes you operate in
        Location:
            - 'TR'
            - 'DE'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Business travel
    - Corporate VPN or secure web gateway egress points in other countries
level: low
---
title: Managed Device Signing In From Unexpected Country With Multiple IP Addresses
id: fa21e299-a1de-41a8-847a-107d83be0193
status: experimental
description: |
    The same managed device signs in successfully from an unexpected country using two or more
    different source IP addresses within 15 minutes. One travelling laptop rarely changes address
    that fast; a stolen session or token replayed through proxies does.
author: Furkan Altun
date: 2026-11-23
tags:
    - attack.initial-access
    - attack.t1078.004
correlation:
    type: value_count
    rules:
        - azure_signin_success_unexpected_country
    group-by:
        - DeviceDetail.displayName
    timespan: 15m
    condition:
        field: IPAddress
        gte: 2
falsepositives:
    - Mobile network or VPN reconnects while travelling
level: medium
