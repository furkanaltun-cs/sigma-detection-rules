title: GitHub Enterprise Repository Visibility Changed To Public
id: 86daa7ce-0631-435b-8e64-6bb08593e7aa
status: experimental
description: Detects a repository in the organisation being switched to public visibility, which can expose source code and embedded secrets.
references:
    - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
author: Furkan Altun
date: 2026-11-23
tags:
    - attack.exfiltration
    - attack.t1567.001
logsource:
    product: github
    service: audit
detection:
    selection:
        action: 'repo.access'
        visibility: 'public'
    condition: selection
falsepositives:
    - Planned open-source releases
level: medium
